name: Importar modulos de Calculo Integral

on:
  push:
    paths:
      - '.github/import/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir y extraer materiales
        shell: bash
        run: |
          set -euo pipefail
          PARTES='.github/import/parts'
          if [ ! -f '.github/import/READY' ]; then
            echo 'No existe la señal READY; no hay importación pendiente.'
            exit 0
          fi
          if [ ! -d "$PARTES" ]; then
            echo 'No existen partes del paquete.'
            exit 1
          fi
          cat "$PARTES"/*.b64 | base64 -d > /tmp/calculo-integral-upload.tar.xz
          TMP="$(mktemp -d)"
          tar -xJf /tmp/calculo-integral-upload.tar.xz -C "$TMP"
          mkdir -p calculo-integral/assets
          mkdir -p calculo-integral/bloques/bloque-01
          mkdir -p calculo-integral/bloques/bloque-02
          mkdir -p calculo-integral/bloques/bloque-03
          cp -R "$TMP/assets/." calculo-integral/assets/
          cp -R "$TMP/bloque-01/." calculo-integral/bloques/bloque-01/
          cp -R "$TMP/bloque-02/." calculo-integral/bloques/bloque-02/
          cp -R "$TMP/bloque-03/." calculo-integral/bloques/bloque-03/

      - name: Confirmar materiales importados
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calculo-integral
          if git diff --cached --quiet; then
            echo 'No existen cambios pendientes.'
            exit 0
          fi
          git commit -m 'Cargar modulos HTML de Calculo Integral'
          git push
